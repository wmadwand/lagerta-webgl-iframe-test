<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | Lagerta</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Lagerta</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/lg04.loader.js";
      var config = {
        dataUrl: buildUrl + "/lg04.data",
        frameworkUrl: buildUrl + "/lg04.framework.js",
        codeUrl: buildUrl + "/lg04.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Novella",
        productName: "Lagerta",
        productVersion: "1.5.71",
        showBanner: unityShowBanner,
      };

      // ��������: ������� ���������� �� ��������� ��� ������������������
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        // ���������� ���������� ���������� �� ���������
        config.devicePixelRatio = 0.5; // ��� 0.75 ���� ����� ����� ��������
        
        // ������������ ������ canvas ��� ���������
        var maxMobileWidth = 720;  // ������ 1080
        var maxMobileHeight = 1280; // ������ 1920
        
        canvas.width = maxMobileWidth;
        canvas.height = maxMobileHeight;
      } else {
        // Desktop - ������ ����������
        canvas.width = 1080;
        canvas.height = 1920;
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          
          // ���������� ������
          function resizeCanvas() {
            var container = document.querySelector("#unity-container");
            var canvas = document.querySelector("#unity-canvas");
            
            var aspectRatio = 1080 / 1920; // ���� ����������� 9:16
            var containerWidth = container.clientWidth;
            var containerHeight = container.clientHeight;
            
            var canvasWidth, canvasHeight;
            
            if (containerWidth / containerHeight > aspectRatio) {
              // ��������� ���� - ��������� �� ������
              canvasHeight = containerHeight;
              canvasWidth = canvasHeight * aspectRatio;
            } else {
              // ��������� ���� - ��������� �� ������
              canvasWidth = containerWidth;
              canvasHeight = canvasWidth / aspectRatio;
            }
            
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';
          }
          
          // �������� ��� �������� � ��� ��������� �������/����������
          window.addEventListener('resize', resizeCanvas);
          window.addEventListener('orientationchange', function() {
            setTimeout(resizeCanvas, 100); // �������� ��� iOS
          });
          resizeCanvas();
          
          fullscreenButton.onclick = () => {
            if (document.body.requestFullscreen) {
              document.body.requestFullscreen();
            } else if (document.body.webkitRequestFullscreen) {
              document.body.webkitRequestFullscreen();
            }
          };
        }).catch((message) => {
          alert(message);
        });
      };


      document.body.appendChild(script);
    </script>

    <script src="unity-fullscreen-button.js"></script>

    <!-- Mobile console ��� ������� -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

  </body>
</html>
